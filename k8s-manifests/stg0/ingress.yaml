    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http2.enabled=false, access_logs.s3.enabled=true, access_logs.s3.bucket=ctp-access-logs-stg-ue2, access_logs.s3.prefix=jpa-app
    external-dns.alpha.kubernetes.io/hostname: inventory.stg0-commerce.2kct.onl
spec:
  rules:
    - host: stg.inventory.api.2kcoretech.online
      http: &backend
        paths:
          - pathType: ImplementationSpecific
            backend:
              service:
                name: inventory
                port:
                  name: http
    - host: stg-inventory-api.2kcoretech.online
      http: *backend
