apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default

resources:
- ../base

images:
- name: jpa-app
  newName: 992382609411.dkr.ecr.us-east-2.amazonaws.com/jpa-app-service
  newTag: 0.40.6-e4af020-master-555

labels:
- includeSelectors: true
  pairs:
    app: jpa-app

patches:
- path: ack-rds.yaml
- path: ack-redis.yaml
- path: deployment.yaml
- path: external-secret.yaml
- path: ingress.yaml
- path: pdb.yaml
- patch: |
    $patch: delete
    apiVersion: rds.services.k8s.aws/v1alpha1
    kind: DBInstance
    metadata:
      name: jpa-app-02
