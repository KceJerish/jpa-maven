apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
spec:
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: inventory
          resources:
            limits:
              memory: 512Mi
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8089
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: management
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1